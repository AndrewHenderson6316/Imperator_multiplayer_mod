l_english:
  wandering_dorian_heritage:0 "Heritage of Wandering Dorians"
  wandering_dorian_heritage_desc:0 "The Dorians, descendants of the heroic Heracles, are steadfast warriors of land and sea. From Epirote hills to the Pelleponese they forged disciplined armies and enduring Civilisations. Guided by ancestral legacy, their tribes blend strength, cunning, and tradition, leaving an indelible mark on Greece’s history and the paths of conquest."
  epiros_heritage: "Epirote Heritage"
  epiros_heritage_desc: "The Molossians of Epirus, descendants of Neoptolemus, son of Achilles, are fierce mountain warriors. Guided by Dodona’s sacred oracle, they thrive in rugged highlands, blending divine guidance and martial skill. Isolated yet resilient, their tribes master highland combat, forging a proud legacy rooted in heroism and the mountains of Epirus."
