  tier_2_generic: "Emergent Power"
  tier_2_generic_desc: "Through conquest and unification, our people have risen from local rulers to kings of a broader realm. With neighboring lands now under one banner, we have forged a state strong enough to command respect and challenge rivals beyond our borders. \n\n#Y This formable does not replace or override base game formables. Players may pursue both the new and vanilla formables. It is also there for those without access to a unique formable, or for players who wish to create their own.#!"

  tier_3_generic: "Consolidate Power"
  tier_3_generic_desc: "With our neighbors brought under our rule, we stand as a power to be reckoned with. We have carved out our place among them and laid the first stones of something greater. \n\n#Y This formable does not replace or override base game formables. Players may pursue both the new and vanilla formables. It is also there for those without access to a unique formable, or for players who wish to create their own.#!"

